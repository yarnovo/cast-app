name: deploy

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

env:
  NODE_VERSION: '24'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: rewrite ssh→https for github (CI 没 ssh key · public repo 走匿名 https)
        run: |
          git config --global url."https://github.com/".insteadOf "git+ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: install
        run: npm install --no-audit --no-fund

      - name: debug · verify chat-layout css fetched
        run: |
          echo "=== chat-layout/src/ChatLayout.css ==="
          head -20 node_modules/@akong/chat-layout/src/ChatLayout.css
          echo "=== chat-input/src/ChatInput.css ==="
          head -20 node_modules/@akong/chat-input/src/ChatInput.css
          echo "=== sticky in installed chat-layout ==="
          grep -c "position: sticky\|position:sticky" node_modules/@akong/chat-layout/src/ChatLayout.css || true

      - name: build
        run: npm run build

      - name: debug · verify dist css
        run: |
          echo "=== sticky in dist ==="
          grep -c "position:sticky" dist/assets/*.css || echo "0 occurrences"

      - name: pick env
        id: env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "bucket=agentaily-cast-app" >> $GITHUB_OUTPUT
            echo "label=prod" >> $GITHUB_OUTPUT
          else
            echo "bucket=agentaily-cast-app-staging" >> $GITHUB_OUTPUT
            echo "label=staging" >> $GITHUB_OUTPUT
          fi

      - name: install ossutil
        run: |
          curl -sLo /tmp/ossutil https://gosspublic.alicdn.com/ossutil/1.7.18/ossutil64
          chmod +x /tmp/ossutil
          sudo mv /tmp/ossutil /usr/local/bin/ossutil
          ossutil --version

      - name: sync to oss
        run: |
          ossutil -i "${{ secrets.ALIYUN_AK }}" -k "${{ secrets.ALIYUN_SK }}" \
            -e oss-cn-hangzhou.aliyuncs.com \
            sync dist/ "oss://${{ steps.env.outputs.bucket }}/" \
            --delete

      - name: summary
        run: |
          echo "deployed ${{ steps.env.outputs.label }} to oss://${{ steps.env.outputs.bucket }}/" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.env.outputs.label }}" = "prod" ]; then
            echo "https://m.cast.agentaily.com/" >> $GITHUB_STEP_SUMMARY
          else
            echo "https://staging.m.cast.agentaily.com/" >> $GITHUB_STEP_SUMMARY
          fi
